<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome: resource:; img-src chrome: data:; script-src chrome:; style-src chrome:; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Codex</title>
    <link rel="stylesheet" href="panel.css" />
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <header id="header">
      <select id="harness" title="Agent"></select>
      <select id="model" title="Model" hidden></select>
      <select id="effort" title="Reasoning effort" hidden></select>
      <span id="spacer"></span>
      <button id="new-chat" class="icon" title="New chat">＋</button>
      <button id="close" class="icon" title="Close (⌘⇧A)">✕</button>
    </header>
    <main id="messages"></main>
    <div id="empty">
      <p>Select text on the page, press <kbd>⌘⇧A</kbd>, and ask.</p>
      <p>Or just type a question about this page.</p>
    </div>
    <footer id="composer">
      <div id="chip" hidden>
        <div id="chip-text"></div>
        <button id="chip-remove" class="icon" title="Remove the selection">✕</button>
      </div>
      <textarea id="input" rows="1" placeholder="Ask about this page…"></textarea>
      <div id="bar">
        <span id="status"></span>
        <button id="stop" hidden>Stop</button>
        <button id="send">Send</button>
      </div>
    </footer>
  </body>
</html>
