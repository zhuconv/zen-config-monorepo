<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Busy frame</title>
  </head>
  <body>
    <!-- Like an ad or tracking frame that keeps its process busy: it blocks
         its main thread for 0.9 s of every second. -->
    <p>an embedded frame</p>
    <script>
      setInterval(() => {
        const end = Date.now() + 900;
        while (Date.now() < end) {}
      }, 1000);
    </script>
  </body>
</html>
